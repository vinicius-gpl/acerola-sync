# Este compose sobe só o server. O Postgres é externo: o endereço vem do `DATABASE_URL` em
# `server/.env`.
#
# Em produção fica atrás de um Traefik (ex.: Coolify), que resolve domínio e TLS;
# localmente é só `-p 3010:3010`.
name: acerola-sync

services:
  server:
    container_name: acerola-sync-server
    image: acerola-sync-server
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - path: ../server/.env
        required: true
    ports:
      - '3010:3010'
    # Deixa o container alcançar um Postgres rodando na própria máquina via
    # `host.docker.internal` (no Linux esse nome não existe sem isso).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # O teste usa o `bash` que já está na imagem — nada de instalar `curl` só pra isso.
    # `start_period` dá tempo às migrations, que o server aplica sozinho ao subir.
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/3010 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
