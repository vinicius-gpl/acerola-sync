# A single compose, local and on the server. Starts only the server: Postgres is external (the
# address comes from `DATABASE_URL` in the server `.env`).
#
# - Port bound to `127.0.0.1`: locally the extension uses http://localhost:3010; on the server
#   nobody from outside reaches it.
# - `proxy` network (external): on the server, Caddy reaches the container through it and
#   handles domain and TLS. Locally `mise run build:server` creates the network if missing.
name: acerola-sync

services:
  server:
    container_name: acerola-sync-server
    image: acerola-sync-server
    build:
      context: ../..
      dockerfile: .config/docker/dockerfile
    env_file:
      - path: ../../.env
        required: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3010:3010'
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # Lets the container reach a Postgres running on the host machine through
    # `host.docker.internal` (on Linux that name does not exist without this).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # The check uses the `bash` already in the image: no installing `curl` just for this.
    # `start_period` gives time to the migrations, which the server applies on startup.
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/3010 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
