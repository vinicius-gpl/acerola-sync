[package]
authors = ["Vinícius Gabriel Pereira Leitão"]
description = "Servidor do Acerola Sync — sincroniza a lista de anime e mangá com o AniList."
edition = "2021"
license = "MIT"
name = "acerola-sync"
version = "0.1.0"

[lib]
name = "acerola_sync_lib"

[[bin]]
name = "acerola-sync"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
anyhow = "1.0.102"
tower = { version = "0.5", features = ["util"] }
