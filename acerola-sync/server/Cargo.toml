[package]
authors = ["Vinícius Gabriel Pereira Leitão"]
description = "Servidor do Acerola Sync — sincroniza a lista de anime e mangá com o AniList."
edition = "2021"
license = "MPL-2.0"
name = "acerola-sync"
version = "1.1.0"

[lib]
name = "acerola_sync_lib"

[[bin]]
name = "acerola-sync"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
axum = "0.8.8"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
log = "0.4"
rand = "0.10"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
anyhow = "1.0.102"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"
