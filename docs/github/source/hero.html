<!doctype html>
<!--
	Fonte da imagem de capa do README (docs/github/ptbr/hero.jpg), no mesmo molde da capa do
	acerola-reader: logo no canto, telas no meio e a frase à direita.
	Para gerar de novo: `node docs/github/source/render-hero.mjs` (precisa do Playwright).
-->
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500;700;900&display=block"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background:
					radial-gradient(1200px 700px at 78% 18%, rgb(96 54 140 / 0.35), transparent 70%),
					radial-gradient(900px 600px at 20% 90%, rgb(60 30 90 / 0.35), transparent 70%),
					#0d0b12;
				font-family: 'Plus Jakarta Sans', sans-serif;
				color: #f1ecf9;
				position: relative;
			}
			/* Grão sutil, como na capa do reader. */
			body::after {
				content: '';
				position: absolute;
				inset: 0;
				opacity: 0.07;
				background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
				pointer-events: none;
			}
			.brand {
				position: absolute;
				top: 72px;
				left: 82px;
				display: flex;
				align-items: center;
				gap: 26px;
			}
			.brand img {
				width: 62px;
				height: 62px;
			}
			.brand span {
				font-size: 48px;
				font-weight: 800;
				letter-spacing: -0.01em;
			}
			.stage {
				position: absolute;
				left: 230px;
				top: 215px;
				width: 1120px;
				height: 760px;
				perspective: 2400px;
			}
			.window {
				position: absolute;
				left: 330px;
				top: 0;
				width: 860px;
				border-radius: 18px;
				overflow: hidden;
				background: #16141c;
				box-shadow:
					0 40px 90px -20px rgb(0 0 0 / 0.75),
					0 0 0 1px rgb(255 255 255 / 0.06);
				transform: rotateY(-16deg) rotateX(3deg);
				transform-origin: left center;
				opacity: 0.92;
			}
			.window .bar {
				height: 34px;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 14px;
				background: #1d1a25;
			}
			.window .bar i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: #3a3546;
			}
			.window .bar b {
				margin-left: 18px;
				height: 18px;
				width: 340px;
				border-radius: 9px;
				background: #2a2633;
			}
			.window img {
				display: block;
				width: 100%;
			}
			.popup {
				position: absolute;
				width: 330px;
				border-radius: 22px;
				overflow: hidden;
				box-shadow:
					0 50px 100px -24px rgb(0 0 0 / 0.85),
					0 0 0 1px rgb(255 255 255 / 0.08);
			}
			.popup img {
				display: block;
				width: 100%;
			}
			.popup.main {
				left: 20px;
				top: 60px;
				width: 380px;
				z-index: 2;
			}
			.popup.side {
				left: 430px;
				top: 190px;
				width: 340px;
				z-index: 1;
			}
			.tagline {
				position: absolute;
				left: 1400px;
				top: 430px;
				width: 440px;
				font-size: 46px;
				line-height: 1.14;
				font-weight: 800;
				color: #d9cdf3;
			}
			.tagline em {
				font-style: normal;
				color: #c4a7f5;
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<img src="acerola.svg" alt="" />
			<span>Acerola Sync</span>
		</div>

		<div class="stage">
			<div class="window">
				<div class="bar"><i></i><i></i><i></i><b></b></div>
				<img src="../ptbr/extension/prints/pagina-lista.png" alt="" />
			</div>
			<div class="popup side"><img src="../ptbr/extension/prints/popup-obra.png" alt="" /></div>
			<div class="popup main"><img src="../ptbr/extension/prints/popup-lista.png" alt="" /></div>
		</div>

		<p class="tagline">
			Sua lista do AniList, <em>marcada sozinha</em> enquanto você assiste e lê.
		</p>
	</body>
</html>
