# Lefthook: the Acerola git hooks. Same file in every project.
# Install once (any of them): mise use -g lefthook · scoop install lefthook · winget install evilmartians.lefthook
# (written in Go: it is not on crates.io, so cargo install does not work)
# Then, at the repository root: node scripts/git/setup-git.mjs   (writes Git-Flow and runs lefthook install)
#
# The admin unlocks their own machine from the branch guard with:  git config project.admin true

commit-msg:
  commands:
    format:
      run: node scripts/git/commit-msg.mjs "{1}"

pre-commit:
  commands:
    branch:
      run: sh scripts/git/branch-guard.sh commit
    design:
      # UI files only; folders and exemptions live in acerola.config.json.
      glob: '*.{svelte,ts,css,html}'
      run: node scripts/design/check-design.mjs {staged_files}
    i18n:
      # Message files: nested English keys, same keys in every locale.
      glob: '**/messages/*.json'
      run: node scripts/i18n/check-i18n.mjs

pre-merge-commit:
  commands:
    branch:
      run: sh scripts/git/branch-guard.sh merge

pre-push:
  commands:
    branch:
      use_stdin: true
      run: sh scripts/git/branch-guard.sh push
