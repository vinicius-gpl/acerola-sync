name: 'Tests/Server'

on:
  push:
    branches: [develop, main]
    paths:
      - 'acerola-sync/server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'acerola-sync/server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola-sync/server
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: acerola-sync/server

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
