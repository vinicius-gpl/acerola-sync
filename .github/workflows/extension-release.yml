name: "Release/Extension"

# Tag `extension/vX.Y.Z` (or `extension/vX.Y.Z-rc.N`, published as a pre-release). Bumps
# `extension/package.json`, builds the Chrome and Firefox zips, pushes the bump back to `main` and
# `develop` and publishes the GitHub Release with the zips.

on:
  push:
    tags:
      - 'extension/v[0-9]+.[0-9]+.[0-9]+'
      - 'extension/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola-sync/package-lock.json

      - name: Extract version
        run: node ../scripts/release/bump.mjs --tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: node ../scripts/release/bump.mjs extension "$VERSION"

      - name: Test
        run: npm run test -w extension

      # The private key stays in the secret; the manifest gets the public one (the fixed id comes from it).
      - name: Extension key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          test -n "$EXTENSION_KEY" || { echo "::error::Missing secret EXTENSION_KEY"; exit 1; }
          PUBLIC=$(printf '%s\n' "$EXTENSION_KEY" | openssl pkey -pubout -outform DER | base64 -w0)
          echo "EXTENSION_PUBLIC_KEY=$PUBLIC" >> "$GITHUB_ENV"

      - name: Build zips (Chrome and Firefox)
        working-directory: acerola-sync/extension
        run: |
          npm run zip
          npm run zip:firefox
          ls -la .output/*.zip

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola-sync/extension/package.json
          if ! git diff --staged --quiet; then
            git commit -m "[build](extension): Versão ${VERSION} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done

            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            git checkout -- .
            until git push origin develop; do
              git fetch origin develop
              git checkout -- .
              git rebase origin/develop
            done
          fi

      # The text comes from `.github/release/extension.md` (highlights and install steps); the
      # change list generated by GitHub goes below it.
      - name: Release notes
        working-directory: ${{ github.workspace }}
        run: sed "s/{{VERSION}}/${VERSION}/g" .github/release/extension.md > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Acerola Sync ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            acerola-sync/extension/.output/*-chrome.zip
            acerola-sync/extension/.output/*-firefox.zip
          generate_release_notes: true
